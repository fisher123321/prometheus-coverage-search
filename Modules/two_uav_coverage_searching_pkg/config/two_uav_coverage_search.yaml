# Coverage Search Configuration
# Based on FALCON algorithm (IEEE T-RO 2024)

# ===== 覆盖搜索参数 =====
coverage_search:
  sim_mode: true
  fly_height: 1.0
  sensing_range: 4.5
  sensing_fov_h: 1.5708    # 90 degrees
  sensing_fov_v: 1.287     # ~74 degrees
  max_vel: 1.5
  max_acc: 1.0
  max_yaw_rate: 1.3962634  # 80 deg/s
  max_yaw_acc: 1.5707963  # 90 deg/s^2
  replan_min_execute_time: 0.5
  replan_periodic_time: 1.5
  replan_remaining_time: 0.5
  trajectory_plan_clearance: 0.60 # B样条引导/梯度修复目标；硬碰撞阈值仍为0.45m
  goal_reach_dist: 0.25
  auto_start: true
  map_input_source: 3      # 0=global pcl, 1=local pcl, 2=scan pcl, 3=D435i depth pcl
  global_pcl_topic: "/map_generator/global_cloud"
  local_pcl_topic: "/map_generator/local_cloud"
  depth_pcl_topic: "/uav1/camera/depth/color/points_downsampled"
  camera_offset_x: 0.095
  camera_offset_y: 0.0
  camera_offset_z: 0.0
  camera_pitch: 0.35
  fov_vis_range: 1.5
  rolling_terminal_speed_ratio: 0.10  # capped at 0.10 in code; lower for hardware tuning
  rolling_terminal_acc_ratio: 0.10    # capped at 0.10 in code; lower for hardware tuning
  traj_step_size: 0.35
  traj_advance_dist: 0.35
  completion_known_ratio: 0.99
  residual_scan_yaw_rate: 0.6
  atsp_enabled: true
  atsp_max_clusters: 5           # hard-capped at 5; exact open ATSP
  atsp_refine_clusters: 3        # refine only the first 3 tour clusters
  atsp_viewpoints_per_cluster: 3 # retain the top 3 viewpoints per refined cluster
  atsp_edge_timeout_ms: 100.0
  atsp_planning_budget_ms: 250.0
  atsp_goal_switch_min_distance: 1.0 # keep current valid goal unless new A* path is >=1m shorter
  atsp_goal_switch_min_ratio: 0.15   # and >=15% shorter; invalid/covered goals switch immediately
  kinodynamic_corridor_radius: 1.0  # restrict state-space A* to the geometric A* corridor
  auction_astar_timeout_ms: 50.0 # per candidate; timeout may use Euclidean fallback, NO_PATH may not
  auction_owner_switch_min_distance: 1.0 # switch owner only for at least 1 m path improvement
  auction_owner_switch_min_ratio: 0.15   # and at least 15% relative path improvement
  swarm_chunk_delta_period: 0.25 # 4 Hz fused-map evidence exchange
  swarm_snapshot_chunks_per_tick: 1 # 增量仍4Hz，每次仅轮询1个完整块

sensor:
  depth_min_range: 0.2
  depth_max_range: 4.5
  depth_height_tolerance: 0.6
  depth_ground_ignore_height: 0.15

# ===== 地图参数 =====
map:
  resolution: 0.2
  esdf_safe_distance: 0.45
  esdf_max_distance: 6.0
  robot_clear_radius: 0.22       # P450机体自清除半径，不包含安全膨胀区
  robot_clear_half_height: 0.20  # P450机体自清除半高度
  tsdf_trunc_dist: 1.0
  queue_size: 5
  origin_x: -9.6
  origin_y: -9.6
  origin_z: -0.5
  map_size_x: 19.2
  map_size_y: 19.2
  map_size_z: 3.0

# ===== 前沿查找器参数 =====
frontier_finder:
  cluster_min: 5           # 最小前沿簇体素数
  retire_changed_ratio: 0.15 # 旧簇15%体素不再是前沿时永久退休并局部重建
  cluster_size_xy: 2.5     # 最大前沿簇尺寸
  candidate_radius: 1.4    # 固定环形候选半径；每簇固定36个候选
  candidate_clearance: 0.45 # 三维ESDF到占据体素的最小净空
  down_sample: 2           # 视点代表前沿的降采样倍率
  min_frontier_height: 0.30
  max_frontier_height: 1.85
  max_frontier_above_flight: 0.35
  frontier_z_half_layers: 5
  split_min_cells: 80
  split_min_aspect_ratio: 1.25
  split_max_aspect_ratio: 6.0
  min_frontier_z_layers: 3
  min_frontier_z_extent: 0.35
  min_frontier_xy_cells: 8
  min_frontier_neighbor_ratio: 0.50
  vis_down_sample: 1
  vis_max_points: 800
  vis_max_total_points: 8000

# ===== 分层网格参数 =====
hgrid:
  cell_size: 5.0           # 网格单元大小(米)
  min_unknown_num: 10      # 最小未知体素数(活跃条件)
  unknown_penalty: 2.0     # 未知区域惩罚因子
